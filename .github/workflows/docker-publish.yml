# Publish to GitHub Container Registry
# ---------------------------------------------------------------------------
# Builds the existing Dockerfile for linux/amd64 and linux/arm64, then pushes
# to ghcr.io/m3ssage/ascii-art.  The resulting package is public (the
# repository is public, so the package is public by default).
#
# Tag scheme
#   vX.Y.Z tag  →  X.Y.Z  +  latest          (stable)
#   main branch →  <sha>  +  edge             (unstable, may include work in
#                                              progress before the next version)
#
# A pull-request trigger is deliberately absent: nothing here should interfere
# with the existing CI check on PRs, and a PR is not a publishable event.
# ---------------------------------------------------------------------------

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

  # Manual re-publish from the Actions tab, for example after a one-time
  # visibility change on the package.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Buildx gives us multi-architecture builds (QEMU is pulled in
      # automatically when needed by docker/setup-buildx-action).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/m3ssage/ascii-art
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: |
            linux/amd64
            linux/arm64