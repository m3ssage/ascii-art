name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: |
          python -m venv .venv
          .venv/bin/pip install -e . pytest
      - name: Run tests
        run: .venv/bin/python -m pytest