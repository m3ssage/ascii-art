services:
  ascii-art:
    build: .
    image: ascii-art-web:1.0.0
    ports:
      - "8080:8080"
    environment:
      ASCII_ART_HOST: "0.0.0.0"
      ASCII_ART_PORT: "8080"
      # ASCII_ART_MAX_BODY_BYTES: "20971520"   # request-body cap (20 MiB default)
      # ASCII_ART_MAX_PIXELS: "40000000"       # decoded pixel cap (40 MP default)
      # ASCII_ART_MAX_CELLS: "4000000"         # output-grid cap (4M cells default)
    restart: unless-stopped
    # No volumes: uploads are rendered in memory and never written to disk.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
